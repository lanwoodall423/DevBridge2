name: Windows validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the complete safe offline validation set'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline coordinator and BridgeTools gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - name: Run impact-aware offline validation
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_FULL: ${{ inputs.full }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:BASE_SHA } else { $env:BEFORE_SHA }
          $head = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_HEAD_SHA } else { $env:PUSH_HEAD_SHA }
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\validate.ps1')

          $missingRange = [string]::IsNullOrWhiteSpace($base) -or
              [string]::IsNullOrWhiteSpace($head) -or
              $base -match '^0+$' -or $head -match '^0+$'
          if ($missingRange) {
              Write-Host 'Base/head context is missing; requesting conservative validation.'
              $arguments += '-Conservative'
          } else {
              $arguments += @('-BaseRevision', $base, '-HeadRevision', $head)
          }
          if ($env:MANUAL_FULL -eq 'true') { $arguments += '-Full' }

          & pwsh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Impact-aware validation failed (exit $LASTEXITCODE)." }

          Write-Host "Validated range: $base..$head"
