name: Windows validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline coordinator and BridgeTools gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - name: Run standard offline validation
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate.ps1

      - name: Check committed diff whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'pull_request') {
              $base = $env:BASE_SHA
          } else {
              $base = $env:BEFORE_SHA
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
              $base = "$($env:HEAD_SHA)^"
          }

          & git diff --check $base $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) {
              throw "git diff --check failed for $base..$($env:HEAD_SHA)."
          }
